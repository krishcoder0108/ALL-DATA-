<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 font-sans">

    <header class="bg-white shadow-sm p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">W.</h1>

        <nav class="hidden md:flex gap-6 text-gray-600 ">
            <div class="hover:text-gray-900 hover:underline hover:scale-105">Explore</div>
            <div class="hover:text-gray-900 hover:underline hover:scale-105">Directory</div>
            <div class="hover:text-gray-900 hover:underline hover:scale-105">Academy</div>
            <div class="hover:text-gray-900 hover:underline hover:scale-105">Jobs</div>
            <div class="hover:text-gray-900 hover:underline hover:scale-105">Market</div>
        </nav>

        <div class="flex items-center gap-3">

            <button class="text-sm hover:text-gray-900 hover:underline hover:scale-105 hover:shadow-md">LOG IN</button>
            <button class="bg-black text-white px-3 py-1 rounded hover:scale-105 hover:shadow-md"> BE PRO </button>
        </div>
    </header>


    <section class="p-4 bg-white mt-2">
        <div class="flex flex-col md:flex-row gap-3 items-center justify-between">

            <input type="text" placeholder="Search by website "
                class="w-full md:w-1/2 p-2  border rounded hover:shadow-md focus:outline-none focus:ring-2 focus:ring-gray-500">
            <div class="flex gap-2 flex-wrap">
                <button class="px-3 py-1 border rounded hover:scale-105 hover:bg-gray-100">Awards</button>
                <button class="px-3 py-1 border rounded hover:scale-105 hover:bg-gray-100">Category</button>
                <button class="px-3 py-1 border rounded hover:scale-105 hover:bg-gray-100">Tag</button>
                <button class="px-3 py-1 border rounded hover:scale-105 hover:bg-gray-100">Technology</button>
                <button class="px-3 py-1 border rounded hover:scale-105 hover:bg-gray-100">Country</button>
            </div>

        </div>
    </section>
</body>

</html>
